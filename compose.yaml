# Paste into Dockge as a new stack. Replace OWNER/REPO with the GitHub repository.
services:
  wedding-triage:
    image: ghcr.io/OWNER/REPO:latest
    container_name: wedding-triage
    restart: unless-stopped
    ports:
      - "8484:8000"
    # Run as the user that owns the app-data dataset below (568 is TrueNAS' "apps" user).
    # user: "568:568"
    environment:
      TZ: Europe/Paris                      # so timestamps match the wedding day
      USERS: "Husband,Wife"                 # the names shown on the "who's sorting?" screen
      # EXCLUDE: "Uncle Bob/*"              # folders to leave out, comma separated (RAW files are always ignored)
      # WORKERS: "2"                        # parallel thumbnail jobs
      # VIDEO_PREVIEWS: "0"                 # skip the 720p video copies (saves CPU, iPhone videos may not play everywhere)
      # --- export to Immich (optional, can be added later) ---
      # IMMICH_URL: "http://192.168.1.10:2283"
      # IMMICH_API_KEY: "paste-key-here"
      # IMMICH_ALBUM: "Wedding - guest picks"
      # --- or copy the picks to a folder (optional) ---
      # EXPORT_DIR: /export
    volumes:
      - /mnt/tank/Photos/wedding-guests:/photos:ro   # originals, read-only
      - /mnt/tank/apps/wedding-triage:/data          # ratings database + thumbnails
      # - /mnt/tank/Photos/wedding-picks:/export
