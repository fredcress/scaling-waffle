# Paste into Dockge as a new stack. Everything personal goes in the stack's .env (see .env.example);
# with no .env at all, the defaults below are used.
services:
  wedding-triage:
    image: ghcr.io/fredcress/scaling-waffle:latest
    container_name: wedding-triage
    restart: unless-stopped
    ports:
      - "${PORT:-8484}:8000"
    # Run as the user that owns the app-data folder (568 is TrueNAS' "apps" user).
    # user: "568:568"
    environment:
      TZ: ${TZ:-Europe/Paris}                  # timezone of the wedding, not of the NAS (see .env.example)
      USERS: ${USERS:-Husband,Wife}
      EXCLUDE: ${EXCLUDE:-}
      WORKERS: ${WORKERS:-2}
      VIDEO_PREVIEWS: ${VIDEO_PREVIEWS:-1}
      BLUR_BELOW: ${BLUR_BELOW:-45}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      IMMICH_ALBUM: ${IMMICH_ALBUM:-Wedding - guest picks}
    volumes:
      - ${PHOTOS_PATH:-/mnt/tank/Photos/wedding-guests}:/photos:ro   # originals, read-only
      - ${DATA_PATH:-/mnt/tank/apps/wedding-triage}:/data            # ratings database + thumbnails
